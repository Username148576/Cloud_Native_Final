_format_version: "3.0"

# ── 全域 Plugin ───────────────────────────────────────────────
plugins:
  - name: rate-limiting
    config:
      minute: 60
      policy: local
      hide_client_headers: false

# ── Services & Routes ─────────────────────────────────────────
services:
  # ── IAM ─────────────────────────────────────────────────────
  - name: iam-service
    url: http://127.0.0.1:3001
    routes:
      - name: iam-public-route
        paths:
          - /iam/auth
        strip_path: true

      - name: iam-protected-route
        paths:
          - /iam
        strip_path: true
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              key_claim_name: iss
          - name: pre-function
            config:
              access:
                - |
                  local auth = kong.request.get_header("Authorization")
                  if not auth then return end
                  local payload_b64 = auth:match("^Bearer [^.]+%.([^.]+)%.")
                  if not payload_b64 then return end
                  local b64 = payload_b64:gsub("-", "+"):gsub("_", "/")
                  local pad = (4 - #b64 % 4) % 4
                  b64 = b64 .. string.rep("=", pad)
                  local decoded = ngx.decode_base64(b64)
                  if not decoded then return end
                  local ok, payload = pcall(require("cjson").decode, decoded)
                  if not ok or not payload then return end
                  if payload.userId  then kong.service.request.set_header("X-User-Id",    tostring(payload.userId))  end
                  if payload.role    then kong.service.request.set_header("X-User-Role",  payload.role)              end
                  if payload.email   then kong.service.request.set_header("X-User-Email", payload.email)             end

