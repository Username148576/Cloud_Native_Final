_format_version: "3.0"

# ── 全域 Plugin ───────────────────────────────────────────────
# 套用在所有 route 上
plugins:
  # IP Rate Limit：每個 IP 每分鐘最多 60 次請求
  - name: rate-limiting
    config:
      minute: 60
      policy: local          # local = 不需要 Redis，單機 Kong 用這個
      hide_client_headers: false

# ── Services & Routes ─────────────────────────────────────────
services:
  # ── IAM ─────────────────────────────────────────────────────
  # /iam/auth/login 和 /iam/auth/verify-email 不需要 JWT（登入本身就是拿 token 的地方）
  # 其他 /iam/** 需要 JWT
  - name: iam-service
    url: http://127.0.0.1:3001
    routes:
      # 公開路由：登入、email 驗證
      - name: iam-public-route
        paths:
          - /iam/auth
        strip_path: true       # /iam/auth/login → /auth/login 送到後端

      # 需要 JWT 的路由
      - name: iam-protected-route
        paths:
          - /iam
        strip_path: true       # /iam/users/1 → /users/1
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              key_claim_name: iss  # token payload 裡用 iss 欄位對應 consumer key

  # ── Notification ─────────────────────────────────────────────
  - name: notification-service
    url: http://127.0.0.1:3002
    routes:
      - name: notification-route
        paths:
          - /notification
        strip_path: true       # /notification/notifications/... → /notifications/...
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              key_claim_name: iss

  # ── Recommendation ───────────────────────────────────────────
  - name: recommendation-service
    url: http://127.0.0.1:3003
    routes:
      - name: recommendation-route
        paths:
          - /recommendation
        strip_path: true
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              key_claim_name: iss

  # ── Billing ──────────────────────────────────────────────────
  - name: billing-service
    url: http://127.0.0.1:3004
    routes:
      - name: billing-route
        paths:
          - /billing
        strip_path: true
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              key_claim_name: iss

  # ── Appeal-Admin ─────────────────────────────────────────────
  - name: appeal-admin-service
    url: http://127.0.0.1:3005
    routes:
      - name: appeal-admin-route
        paths:
          - /appeal-admin
        strip_path: true
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              key_claim_name: iss

# ── Consumers & JWT 憑證 ──────────────────────────────────────
# Kong 的 JWT plugin 需要一個 consumer 對應一組 key/secret
# key   → 放在 JWT payload 的 iss 欄位
# secret → 用來簽 JWT（必須跟 IAM service 的 JWT_SECRET 一致）
#
# 這裡建立一個代表「所有由 IAM service 簽發的 token」的 consumer
consumers:
  - username: iam-issued
    jwt_secrets:
      - key: ordering-system          # iss claim 的值，IAM 簽 token 時要帶這個
        secret: "${JWT_SECRET}"       # 對應 IAM service 的 JWT_SECRET 環境變數
        algorithm: HS256