_format_version: "3.0"

plugins:
  # 全域 rate limit
  - name: rate-limiting
    config:
      minute: 60
      policy: local
      hide_client_headers: false

  # 全域 CORS：讓 OPTIONS preflight 不被 JWT 擋
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - X-User-Id
        - X-User-Role
        - X-User-Email
      exposed_headers:
        - X-User-Id
        - X-User-Role
        - X-User-Email
      credentials: true
      preflight_continue: false

services:
  # ── IAM public ───────────────────────────────────────────────
  - name: iam-public-service
    url: http://127.0.0.1:3001
    routes:
      - name: iam-public-route
        paths:
          - /iam/auth/login
          - /iam/auth/verify-email
          - /iam/apply/send-code
        strip_path: false
        plugins:
          - name: pre-function
            config:
              access:
                - |
                  local path = kong.request.get_path()
                  local rewritten = path:gsub("^/iam", "", 1)
                  kong.service.request.set_path(rewritten)

  # ── IAM protected ────────────────────────────────────────────
  - name: iam-service
    url: http://127.0.0.1:3001
    routes:
      - name: iam-protected-route
        paths:
          - /iam
        strip_path: true
        plugins:
          - name: jwt
            config:
              secret_is_base64: false
              key_claim_name: iss
          - name: pre-function
            config:
              access:
                - |
                  local auth = kong.request.get_header("Authorization")
                  if not auth then return end
                  local token = auth:sub(8)
                  local parts = {}
                  for part in token:gmatch("[^.]+") do
                    parts[#parts + 1] = part
                  end
                  if #parts < 2 then return end
                  local b64 = parts[2]:gsub("-", "+"):gsub("_", "/")
                  local pad = (4 - #b64 % 4) % 4
                  b64 = b64 .. string.rep("=", pad)
                  local decoded = ngx.decode_base64(b64)
                  if not decoded then return end
                  -- 不用 require("cjson")，直接用 pattern 從 JSON 字串抓值
                  local userId = decoded:match('"userId"%s*:%s*(%d+)')
                  local role   = decoded:match('"role"%s*:%s*"([^"]+)"')
                  local email  = decoded:match('"email"%s*:%s*"([^"]+)"')
                  if userId then kong.service.request.set_header("X-User-Id",    userId) end
                  if role   then kong.service.request.set_header("X-User-Role",  role)   end
                  if email  then kong.service.request.set_header("X-User-Email", email)  end

