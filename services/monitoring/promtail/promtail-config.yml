server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: ${LOKI_URL}

scrape_configs:
  - job_name: ordering-pm2
    static_configs:
      - targets:
          - localhost
        labels:
          job: ordering-services
          host: ${HOSTNAME}
          __path__: /var/log/ordering/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            message: message
            requestId: requestId
            method: method
            route: route
            statusCode: statusCode
      - labels:
          level:
          service:
          method:
          route:
          statusCode:
